# ==============================================================================
# Rust Starter Settings (wird von Windows .bat und Linux .sh gelesen)
# Listen-Eintraege werden von links nach rechts geprueft (1. Treffer gewinnt).
# Platzhalter:
#   {APP}         = Projektname (APP_NAME)
#   {SCRIPT_DIR}  = Projektverzeichnis
#   {PARENT}      = Oberverzeichnis des Projekts (z.B. R:\git oder /r/git)
#   {USERPROFILE} = Benutzerordner unter Windows (z.B. C:\Users\...)
#   {HOME}        = Benutzerordner unter Linux (z.B. /home/...)
# ==============================================================================

# 1. Build-Profil: "release" oder "debug" (ueberschreibbar per --release / --debug)
DEFAULT_PROFILE=release

# 2. Build-Zielverzeichnis (CARGO_TARGET_DIR) mit Fallback-Kette (1. Treffer gewinnt)
#    Prueft der Reihe nach, ob das Ziellaufwerk existiert und mindestens
#    MIN_FREE_MB_FOR_TARGET MB Speicherplatz frei hat.
#    Wenn Eintrag 1 (z.B. auf R:) nicht existiert oder voll ist, wird automatisch
#    auf Eintrag 2 (z.B. C:\cargo-target\...) ausgewichen.
TARGET_DIRS_WIN={SCRIPT_DIR}\target;C:\cargo-target\{APP}
TARGET_DIRS_LINUX={SCRIPT_DIR}/target;{HOME}/.cache/cargo-target/{APP}
MIN_FREE_MB_FOR_TARGET=1024

# 3. Suchpfade fuer benoetigte Kits (rust-kit, slint-desktop-kit) in Prioritaets-Reihenfolge
#    Prueft der Reihe nach, ob <Pfad>\<kit>\Cargo.toml existiert, und verlinkt es
#    bei Bedarf automatisch nach {PARENT}\<kit>.
KIT_SEARCH_DIRS_WIN={PARENT};{USERPROFILE}\Projekte;R:\git;C:\git
KIT_SEARCH_DIRS_LINUX={PARENT};{HOME}/Projekte;/r/git;{HOME}/git

# Verhalten falls ein benoetigtes Kit in keinem Suchpfad gefunden wird:
#   "clone" = automatisch von GitHub nach {PARENT}\<kit> klonen
#   "error" = mit Fehlermeldung abbrechen
KIT_MISSING_ACTION=clone
KIT_GITHUB_OWNER=1337userxyz

# 4. Rust Toolchain / CARGO_HOME Suchkette (Windows) & Registry-Schonung
CARGO_HOME_DIRS_WIN=R:\.cargo;{USERPROFILE}\.cargo
RUSTUP_HOME_DIRS_WIN=R:\.rustup;{USERPROFILE}\.rustup
# Wenn CARGO_HOME auf R: liegt, Registry-Cache per Junction nach {USERPROFILE}\.cargo\registry verlinken
LINK_CARGO_REGISTRY_TO_USERPROFILE=1

# 5. Speicherplatz-Schonung & Build-Verhalten
# Anderes Profil (debug bei release-Build bzw. umgekehrt) nach dem Build loeschen:
#   "auto" = nur auf RAM-Disk (R:\ bzw. /r/), "1" = immer, "0" = nie
CLEAN_OTHER_PROFILE=auto
# Unter Windows .pdb Debug-Symbole nach dem Build loeschen (1 = ja, 0 = nein)
STRIP_PDB_WIN=1
# Maximale parallele Compiler-Jobs (0 = Cargo-Standard / alle Kerne)
CARGO_JOBS=0

# 6. Start-Verhalten
#   "build_and_run" = immer cargo build ausfuehren und danach starten (Standard)
#   "run_if_exists" = direkt starten falls Binary schon existiert, sonst erst bauen
#   "build_only"    = nur kompilieren, Programm nicht starten
RUN_MODE=build_and_run
# Fenster bei Build-Fehler offen halten (1 = pause / Eingabe abwarten, 0 = direkt beenden)
PAUSE_ON_ERROR=1
