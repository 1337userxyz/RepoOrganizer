name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout slint-desktop-kit
        run: git clone https://github.com/1337userxyz/slint-desktop-kit.git ../slint-desktop-kit
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libxcb1-dev libxkbcommon-dev libfontconfig1-dev
      - run: cargo test --workspace
