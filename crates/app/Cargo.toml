[package]
name = "repoorganizer"
version.workspace = true
edition.workspace = true

[dependencies]
repoorganizer-core = { version = "0.1.0", path = "../core" }
repoorganizer-git = { version = "0.1.0", path = "../git" }
kit-dialog = { path = "../../../rust-kit/crates/kit-dialog", version = "0.1.0" }
kit-slint = { path = "../../../slint-desktop-kit/crates/kit-slint", version = "0.1.0" }
kit-logging = { path = "../../../rust-kit/crates/kit-logging", version = "0.1.0" }
kit-launcher = { path = "../../../rust-kit/crates/kit-launcher", version = "0.1.0" }
slint = "1.18.1"
log = "0.4"

[build-dependencies]
kit-theme = { path = "../../../slint-desktop-kit/crates/kit-theme", features = ["build"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
