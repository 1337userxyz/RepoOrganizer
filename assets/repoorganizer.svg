<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Abgerundeter Hintergrund mit dezentem Rahmen -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="#334155" stroke-width="2.5" filter="url(#shadow)"/>

  <!-- Subtiles Grid / Tech-Muster im Hintergrund -->
  <path d="M 24 38 L 104 38 M 24 64 L 104 64 M 24 90 L 104 90" stroke="#334155" stroke-width="1" stroke-dasharray="2 4" opacity="0.4"/>

  <!-- Stilisiertes Ordner-Icon (Basis des Organizers) -->
  <path d="M 22 42 C 22 38.7 24.7 36 28 36 L 46 36 C 48.5 36 50.8 37.3 52 39.5 L 56 46 L 100 46 C 103.3 46 106 48.7 106 52 L 106 94 C 106 97.3 103.3 100 100 100 L 28 100 C 24.7 100 22 97.3 22 94 Z" fill="#1e293b" stroke="#475569" stroke-width="2.5" opacity="0.8"/>

  <!-- Git-Branch Pfade -->
  <!-- Hauptstrang (Vertikal) -->
  <line x1="44" y1="48" x2="44" y2="86" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Abzweigender Ast -->
  <path d="M 44 68 C 44 58, 76 68, 76 56" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Sync-Schleife / Wiederzusammenführung -->
  <path d="M 76 56 C 76 76, 52 82, 48 86" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="3 3" opacity="0.75"/>

  <!-- Git Commit Nodes mit Leuchteffekt -->
  <!-- Node 1: Root / Main (Grün) -->
  <circle cx="44" cy="86" r="7.5" fill="url(#nodeGrad1)" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
  <!-- Node 2: Feature / Branch (Orange) -->
  <circle cx="76" cy="54" r="6.5" fill="url(#nodeGrad2)" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
  <!-- Node 3: Upstream / Head (Blau) -->
  <circle cx="44" cy="48" r="6.5" fill="url(#nodeGrad3)" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>

  <!-- Sync-Badge / Pfeile unten rechts -->
  <circle cx="92" cy="84" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
  <path d="M 85 82 A 7 7 0 0 1 97 78 L 99 75 M 99 79 L 99 75 L 95 75" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 99 86 A 7 7 0 0 1 87 90 L 85 93 M 85 89 L 85 93 L 89 93" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
